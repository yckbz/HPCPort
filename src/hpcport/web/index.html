<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HPCPort</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <!-- Auth Gate (shown only when unauthenticated) -->
  <div id="auth-gate" class="auth-gate hidden" role="dialog" aria-modal="true">
    <div class="auth-card">
      <div class="auth-top-row">
        <div class="brand-mark">
          <svg class="brand-icon" viewBox="0 0 28 28" fill="none" aria-hidden="true">
            <rect width="28" height="28" rx="8" fill="currentColor" fill-opacity="0.12"/>
            <path d="M8 10.5h12M8 14h12M8 17.5h7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle cx="19.5" cy="17.5" r="2" fill="currentColor"/>
          </svg>
          <span class="brand-title">HPCPort</span>
        </div>
        <div class="lang-pill" id="auth-lang-toggle" role="group" aria-label="Language">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="zh">ZH</button>
        </div>
      </div>
      <h1 id="auth-title">Unlock HPCPort</h1>
      <p id="auth-desc" class="muted"></p>
      <form id="pin-form" class="pin-form" autocomplete="off">
        <input id="pin-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6"
               placeholder="000000" required autofocus />
        <button type="submit" id="pin-submit" class="btn btn-primary"></button>
      </form>
      <div id="pin-error" class="inline-error hidden"></div>
      <p id="auth-tip" class="auth-tip"></p>
    </div>
  </div>

  <!-- Main App Shell -->
  <div id="app-shell" class="app-shell hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <div class="brand-mark">
            <svg class="brand-icon" viewBox="0 0 28 28" fill="none" aria-hidden="true">
              <rect width="28" height="28" rx="8" fill="currentColor" fill-opacity="0.12"/>
              <path d="M8 10.5h12M8 14h12M8 17.5h7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <circle cx="19.5" cy="17.5" r="2" fill="currentColor"/>
            </svg>
            <div class="brand-text">
              <span class="brand-title">HPCPort</span>
              <span id="sse-indicator" class="sse-pill">
                <span class="sse-dot"></span>
                <span id="sse-label">Live</span>
              </span>
            </div>
          </div>
        </div>

        <nav class="segmented-nav" id="main-nav" role="tablist">
          <button type="button" class="nav-tab active" data-tab="approvals" role="tab">
            <span data-i18n="navApprovals">Approvals</span>
            <span id="approvals-badge" class="badge-count hidden">0</span>
          </button>
          <button type="button" class="nav-tab" data-tab="jobs" role="tab">
            <span data-i18n="navJobs">Overview &amp; Jobs</span>
          </button>
          <button type="button" class="nav-tab" data-tab="audit" role="tab">
            <span data-i18n="navAudit">Audit</span>
          </button>
          <button type="button" class="nav-tab" data-tab="settings" role="tab">
            <span data-i18n="navSettings">Settings</span>
          </button>
        </nav>

        <div class="topbar-right">
          <select id="project-select" class="select-compact" aria-label="Project"></select>
          <button type="button" id="poll-btn" class="btn btn-subtle btn-sm" title="Poll">
            <svg class="icon-sm" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M16.5 10a6.5 6.5 0 1 1-1.6-4.27M16.5 3.5v3h-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span id="poll-btn-label" data-i18n="pollNow">Poll Now</span>
          </button>
          <button type="button" id="notif-btn" class="btn btn-subtle btn-sm" title="Desktop Alerts">
            <svg class="icon-sm" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M10 3a4.5 4.5 0 0 0-4.5 4.5v2.7L4 12.8h12l-1.5-2.6V7.5A4.5 4.5 0 0 0 10 3Zm-1.8 12a1.8 1.8 0 0 0 3.6 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span id="notif-btn-label"></span>
          </button>
          <button type="button" id="theme-btn" class="btn btn-icon" aria-label="Toggle theme">
            <svg id="theme-icon-sun" class="icon-sm hidden" viewBox="0 0 20 20" fill="none">
              <circle cx="10" cy="10" r="3.5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M15.3 4.7l-1.4 1.4M6.1 13.9l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <svg id="theme-icon-moon" class="icon-sm" viewBox="0 0 20 20" fill="none">
              <path d="M15.8 12.2A6 6 0 0 1 7.8 4.2a6.5 6.5 0 1 0 8 8Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="lang-pill" id="lang-toggle" role="group" aria-label="Language">
            <button type="button" data-lang="en">EN</button>
            <button type="button" data-lang="zh">ZH</button>
          </div>
        </div>
      </div>
    </header>

    <main class="main-content">
      <section id="view-approvals" class="view-section"></section>
      <section id="view-jobs" class="view-section hidden"></section>
      <section id="view-audit" class="view-section hidden"></section>
      <section id="view-settings" class="view-section hidden"></section>
    </main>
  </div>

  <!-- Slide-over Inspection Drawer -->
  <div id="drawer-backdrop" class="backdrop hidden"></div>
  <aside id="drawer" class="drawer hidden" aria-hidden="true">
    <div class="drawer-header">
      <div>
        <h2 id="drawer-title"></h2>
        <div id="drawer-subtitle" class="muted text-xs"></div>
      </div>
      <div class="drawer-actions">
        <button type="button" id="drawer-refresh" class="btn btn-subtle btn-sm"></button>
        <button type="button" id="drawer-close" class="btn btn-icon" aria-label="Close">&times;</button>
      </div>
    </div>
    <div id="drawer-tabs" class="drawer-tabs"></div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <!-- Modal Dialog -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal-dialog" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button type="button" id="modal-close" class="btn btn-icon" aria-label="Close">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
